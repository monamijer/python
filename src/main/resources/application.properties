# --- Application ---
spring.application.name=series-tv-api
server.port=8080

# --- MySQL (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/series_tv_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&serverVersion=10.4.32
spring.datasource.username=root
spring.datasource.password=jer000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Hibernate will just validate/complete it). Never use 'update' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- TMDB external API ---
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY:YOUR_TMDB_API_KEY_HERE}

jwt.secret=${JWT_SECRET:changez-cette-cle-en-production-elle-doit-faire-au-moins-32-caracteres}
jwt.expiration-ms=86400000