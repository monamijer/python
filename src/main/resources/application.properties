# application.properties

# --- Application ---
spring.application.name=series-tv-api
server.port=8080

# --- MySQL (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/series_tv_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' is fine for an exam project (schema already created via SQL script above,
# Hibernate will just validate/complete it). Never use 'update' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- TMDB external API ---
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.key=YOUR_TMDB_API_KEY_HERE