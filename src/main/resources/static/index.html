<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series TV — Suivi de séries</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
<div id="login" class="ecran-auth">
    <div class="auth-carte">
      <h1>📺 Series TV</h1>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-auth="connexion">Connexion</button>
        <button type="button" class="auth-tab" data-auth="inscription">Inscription</button>
      </div>

      <form id="form-connexion" class="form-auth auth-panel active">
        <input id="login-email" type="email" placeholder="Email" required>
        <input id="login-motdepasse" type="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
      </form>

      <form id="form-inscription" class="form-auth auth-panel">
        <input id="inscription-pseudo" type="text" placeholder="Pseudo" required>
        <input id="inscription-email" type="email" placeholder="Email" required>
        <input id="inscription-motdepasse" type="password" placeholder="Mot de passe (min 8)" required>
        <button type="submit">S'inscrire</button>
      </form>

      <p id="login-erreur" class="erreur"></p>
    </div>
  </div>

  <!-- ===== APPLICATION ===== -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-top">
        <h1>📺 Series TV</h1>
        <button id="btn-deconnexion" class="btn-deconnexion">Déconnexion</button>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="mes-series">Mes séries</button>
        <button class="tab-btn" data-tab="decouvrir">Découvrir (TMDB)</button>
      </nav>
    </header>

    <main>
      <section id="mes-series" class="tab-panel active">
        <form id="form-ajout-serie" class="card form-inline">
          <input type="text" id="input-titre" placeholder="Titre de la série" required>
          <input type="text" id="input-genre" placeholder="Genre">
          <button type="submit">Ajouter</button>
        </form>
        <div id="liste-series" class="grid"></div>
      </section>

      <section id="decouvrir" class="tab-panel">
        <form id="form-recherche-tmdb" class="card form-inline">
          <input type="text" id="input-recherche" placeholder="Rechercher une série...">
          <button type="submit">Rechercher</button>
          <button type="button" id="btn-populaires">Populaires</button>
        </form>
        <div id="resultats-tmdb" class="grid"></div>
      </section>
    </main>

    <div id="panneau-detail" class="panneau-detail hidden">
      <div class="panneau-contenu">
        <button id="btn-fermer-panneau" class="btn-fermer">&times;</button>
        <div id="detail-contenu"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
